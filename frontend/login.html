<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpresoFast — Iniciar sesión</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
  <form id="formLogin" class="login-card">
    <h1>ExpresoFast</h1>
    <label>Usuario
      <input type="text" id="username" required>
    </label>
    <label>Contraseña
      <input type="password" id="password" required>
    </label>
    <button type="submit">Ingresar</button>
    <p id="errorLogin" class="error-msg" role="alert" aria-live="polite"></p>
  </form>

  <script>
    const API_BASE = "http://localhost:8080/api";

    document.getElementById("formLogin").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const res = await fetch(`${API_BASE}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      if (res.ok) {
        const data = await res.json();
        sessionStorage.setItem("jwt_token", data.token);
        sessionStorage.setItem("username", data.username);
        sessionStorage.setItem("roles", JSON.stringify(data.roles));
        window.location.href = "index.html";
      } else {
        document.getElementById("errorLogin").textContent = "Usuario o contraseña incorrectos";
      }
    });
  </script>
</body>
</html>
